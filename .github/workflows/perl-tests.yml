
name: CI

on:
  push:
  pull_request:

jobs:
  perl-job:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
        perl:
          - "5.42.0"

    runs-on: ${{ matrix.runner }}
    name: OS ${{ matrix.runner }} Perl ${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          curl \
          perl \
          make \
          gcc \
          mysql-server \
          mysql-client \
          libmysqlclient-dev \
          libcrypt-dev 
      - name: Install cpanminus
        run: |
          curl -L https://cpanmin.us | perl - App::cpanminus
      - name: Install Bit::Vector
        run: |
          cpanm Bit::Vector --configure-args="OPTIMIZE='-O2 -g -std=gnu17'"
      - name: Install File::Which
        run: cpanm File::Which
      - name: Create MYMETA file 
        run: |
          perl Makefile.PL
          make
      - name: Install Perl dependencies
        run: |
          cpanm --installdeps --with-develop .
      - name: Run tests
        run: |
          make test
