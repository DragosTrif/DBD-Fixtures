name: CI

on:
  push:
  pull_request:

jobs:
  perl-job:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
        perl:
          - "5.42.0"
    # Acestea trebuie să fie indentate la același nivel cu strategy
    runs-on: ${{ matrix.runner }}
    name: OS ${{ matrix.runner }} Perl ${{ matrix.perl }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y \
          curl \
          perl \
          make \
          gcc \
          mysql-server \
          mysql-client \
          libmysqlclient-dev \
          libcrypt-dev \
          && rm -rf /var/lib/apt/lists/*
      - name: Install perl modules
        run: |
          curl -L https://cpanmin.us | perl - App::cpanminus && cpanm --installdeps --with-develop .
      - name: Run Tests on Linux
        run: |
          perl Makefile.PL
          make
          make test
